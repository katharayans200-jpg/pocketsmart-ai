{% extends "base.html" %}
{% block title %}History{% endblock %}
{% block content %}
<section class="page-hero"><div class="container"><h1>Your recommendation history</h1>
  <p>View all your previous budget plans.</p></div></section>
<div class="container section-tight">
  <div class="filters" id="history-filters" role="tablist" aria-label="Filter by planner">
    <button class="filter active" data-filter="">All</button>
    <button class="filter" data-filter="home">🏠 Home</button>
    <button class="filter" data-filter="party">🎉 Party</button>
    <button class="filter" data-filter="jewelry">💎 Jewelry</button>
  </div>
  <div id="history-list" class="grid grid-3" aria-live="polite"><div class="loading-block">Loading your plans…</div></div>
</div>
{% endblock %}
